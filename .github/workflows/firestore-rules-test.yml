name: Test regole Firestore
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore-tests/**'
      - 'firebase.json'
jobs:
  rules_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: firestore-tests
        run: npm install
      - name: Test (emulatore, nessun dato vero)
        working-directory: firestore-tests
        run: npm test
